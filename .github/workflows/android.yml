name: Build Ycash Android Node

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  ANDROID_API: "35"
  ANDROID_NDK: "27.2.12479018"
  RUST_TARGET: "aarch64-linux-android"

jobs:
  build:
    name: Build Android ARM64 Node + APK
    runs-on: ubuntu-22.04

    steps:
      # ---------------------------------------------------------
      # 1. Checkout source
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Java
      # ---------------------------------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ---------------------------------------------------------
      # 3. Android SDK / NDK
      # ---------------------------------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;35.0.0" \
            "ndk;${ANDROID_NDK}"

      # ---------------------------------------------------------
      # 4. Rust
      # ---------------------------------------------------------
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.RUST_TARGET }}

      # ---------------------------------------------------------
      # 5. Configure Android linker
      # ---------------------------------------------------------
      - name: Configure Android Rust linker
        shell: bash
        run: |
          NDK="$ANDROID_HOME/ndk/${ANDROID_NDK}"

          CLANG="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          echo "ANDROID_NDK=$NDK"
          echo "CLANG=$CLANG"

          test -x "$CLANG/aarch64-linux-android35-clang"

          mkdir -p .cargo

          cat > .cargo/config.toml <<EOF
          [target.aarch64-linux-android]
          linker = "$CLANG/aarch64-linux-android35-clang"
          ar = "$CLANG/llvm-ar"
          EOF

      # ---------------------------------------------------------
      # 6. Verify Rust workspace
      # ---------------------------------------------------------
      - name: Verify Rust workspace
        shell: bash
        run: |
          cargo metadata --format-version 1 --no-deps

          echo "Rust workspace:"
          cargo metadata --format-version 1 --no-deps \
            | python3 -c '
          import json,sys
          d=json.load(sys.stdin)
          for p in d["packages"]:
              print(p["name"])
          '

      # ---------------------------------------------------------
      # 7. Cache Cargo
      # ---------------------------------------------------------
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ycash-${{ runner.os }}-${{ env.RUST_TARGET }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ycash-${{ runner.os }}-${{ env.RUST_TARGET }}-
            ycash-${{ runner.os }}-

      # ---------------------------------------------------------
      # 8. Build the actual Ycash Android node
      # ---------------------------------------------------------
      - name: Build Ycash ARM64 Android node
        shell: bash
        run: |
          cargo build \
            --release \
            --target "${RUST_TARGET}" \
            -p ycash-android-node

      # ---------------------------------------------------------
      # 9. Verify the node executable
      # ---------------------------------------------------------
      - name: Verify ARM64 node binary
        shell: bash
        run: |
          NODE="target/${RUST_TARGET}/release/ycash-android-node"

          test -f "$NODE"
          test -x "$NODE"

          echo "Node binary:"
          file "$NODE"

          echo "Binary architecture:"
          readelf -h "$NODE" | grep -E \
            "Class:|Machine:|Type:"

          echo "Android dependencies:"
          readelf -d "$NODE" | grep NEEDED || true

      # ---------------------------------------------------------
      # 10. Copy exact Rust binary into Android app assets
      # ---------------------------------------------------------
      - name: Package Rust node into Android app
        shell: bash
        run: |
          NODE="target/${RUST_TARGET}/release/ycash-android-node"
          ASSETS="android-app/app/src/main/assets"

          mkdir -p "$ASSETS"

          rm -f "$ASSETS/ycash-android-node"

          cp "$NODE" "$ASSETS/ycash-android-node"

          chmod 755 "$ASSETS/ycash-android-node"

          echo "Packaged node:"
          ls -lh "$ASSETS/ycash-android-node"

      # ---------------------------------------------------------
      # 11. Verify Android project
      # ---------------------------------------------------------
      - name: Verify Android project
        shell: bash
        run: |
          test -f android-app/settings.gradle
          test -f android-app/app/build.gradle
          test -f android-app/app/src/main/AndroidManifest.xml
          test -f android-app/app/src/main/assets/ycash-android-node

      # ---------------------------------------------------------
      # 12. Set up Gradle
      # ---------------------------------------------------------
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # ---------------------------------------------------------
      # 13. Build Android APK
      # ---------------------------------------------------------
      - name: Build debug APK
        working-directory: android-app
        shell: bash
        run: |
          gradle \
            --no-daemon \
            --stacktrace \
            assembleDebug

      # ---------------------------------------------------------
      # 14. Verify APK exists
      # ---------------------------------------------------------
      - name: Verify APK
        shell: bash
        run: |
          APK="android-app/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "APK:"
          ls -lh "$APK"

      # ---------------------------------------------------------
      # 15. Verify node is actually inside APK
      # ---------------------------------------------------------
      - name: Verify node is packaged inside APK
        shell: bash
        run: |
          APK="android-app/app/build/outputs/apk/debug/app-debug.apk"

          echo "Searching APK for bundled Ycash node..."

          unzip -l "$APK" | grep \
            "assets/ycash-android-node"

          echo "Bundled node verified."

      # ---------------------------------------------------------
      # 16. APK contents
      # ---------------------------------------------------------
      - name: Inspect APK
        shell: bash
        run: |
          APK="android-app/app/build/outputs/apk/debug/app-debug.apk"

          unzip -l "$APK" | head -100

      # ---------------------------------------------------------
      # 17. Upload APK
      # ---------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ycash-android-node-debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # ---------------------------------------------------------
      # 18. Upload raw ARM64 node
      # ---------------------------------------------------------
      - name: Upload ARM64 node binary
        uses: actions/upload-artifact@v4
        with:
          name: ycash-android-node-arm64
          path: target/${{ env.RUST_TARGET }}/release/ycash-android-node
          if-no-files-found: error
