name: Build Ycash Android Node

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  ANDROID_API: "35"
  ANDROID_NDK: "27.2.12479018"
  RUST_TARGET: "aarch64-linux-android"

  # Temporary CI signing values.
  # These are ONLY for debug/testing APKs.
  CI_KEYSTORE: "${{ github.workspace }}/ci-debug.keystore"
  CI_KEY_ALIAS: "ycash-debug"
  CI_KEYSTORE_PASSWORD: "ycash-debug-password"
  CI_KEY_PASSWORD: "ycash-debug-password"

jobs:
  build:
    name: Build, Sign and Verify Ycash Android Node
    runs-on: ubuntu-22.04

    steps:

      # ---------------------------------------------------------
      # 1. Checkout
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Java 17
      # ---------------------------------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ---------------------------------------------------------
      # 3. Android SDK
      # ---------------------------------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;35.0.0" \
            "ndk;${ANDROID_NDK}"

      # ---------------------------------------------------------
      # 4. Rust
      # ---------------------------------------------------------
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.RUST_TARGET }}

      # ---------------------------------------------------------
      # 5. Configure Android linker
      # ---------------------------------------------------------
      - name: Configure Android Rust linker
        shell: bash
        run: |
          NDK="$ANDROID_HOME/ndk/${ANDROID_NDK}"
          CLANG="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          echo "ANDROID_NDK=$NDK"
          echo "CLANG=$CLANG"

          test -x "$CLANG/aarch64-linux-android35-clang"

          mkdir -p .cargo

          cat > .cargo/config.toml <<EOF
          [target.aarch64-linux-android]
          linker = "$CLANG/aarch64-linux-android35-clang"
          ar = "$CLANG/llvm-ar"
          EOF

      # ---------------------------------------------------------
      # 6. Verify Rust workspace
      # ---------------------------------------------------------
      - name: Verify Rust workspace
        shell: bash
        run: |
          cargo metadata --format-version 1 --no-deps

      # ---------------------------------------------------------
      # 7. Cache Cargo
      # ---------------------------------------------------------
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ycash-${{ runner.os }}-${{ env.RUST_TARGET }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ycash-${{ runner.os }}-${{ env.RUST_TARGET }}-
            ycash-${{ runner.os }}-

      # ---------------------------------------------------------
      # 8. Build Rust node
      # ---------------------------------------------------------
      - name: Build Ycash ARM64 Android node
        shell: bash
        run: |
          cargo build \
            --release \
            --target "${RUST_TARGET}" \
            -p ycash-android-node

      # ---------------------------------------------------------
      # 9. Verify ARM64 executable
      # ---------------------------------------------------------
      - name: Verify ARM64 node binary
        shell: bash
        run: |
          NODE="target/${RUST_TARGET}/release/ycash-android-node"

          test -f "$NODE"
          test -x "$NODE"

          echo "Node binary:"
          file "$NODE"

          echo "ELF information:"
          readelf -h "$NODE" | grep -E \
            "Class:|Machine:|Type:"

          echo "Required shared libraries:"
          readelf -d "$NODE" | grep NEEDED || true

      # ---------------------------------------------------------
      # 10. Put exact node binary into APK assets
      # ---------------------------------------------------------
      - name: Package Rust node into Android app
        shell: bash
        run: |
          NODE="target/${RUST_TARGET}/release/ycash-android-node"
          ASSETS="android-app/app/src/main/assets"

          mkdir -p "$ASSETS"

          rm -f "$ASSETS/ycash-android-node"

          cp "$NODE" "$ASSETS/ycash-android-node"

          chmod 755 "$ASSETS/ycash-android-node"

          echo "Bundled node:"
          ls -lh "$ASSETS/ycash-android-node"

      # ---------------------------------------------------------
      # 11. Generate temporary CI signing keystore
      # ---------------------------------------------------------
      - name: Generate temporary debug signing keystore
        shell: bash
        run: |
          rm -f "$CI_KEYSTORE"

          keytool \
            -genkeypair \
            -v \
            -keystore "$CI_KEYSTORE" \
            -storepass "$CI_KEYSTORE_PASSWORD" \
            -keypass "$CI_KEY_PASSWORD" \
            -alias "$CI_KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname "CN=Ycash CI Debug, OU=Development, O=Ycash, L=CI, ST=CI, C=GB"

          test -f "$CI_KEYSTORE"

          echo "Temporary signing keystore generated."

      # ---------------------------------------------------------
      # 12. Build Android APK
      # ---------------------------------------------------------
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build unsigned/debug APK
        working-directory: android-app
        shell: bash
        run: |
          gradle \
            --no-daemon \
            --stacktrace \
            assembleDebug

      # ---------------------------------------------------------
      # 13. Locate APK
      # ---------------------------------------------------------
      - name: Locate APK
        id: apk
        shell: bash
        run: |
          APK="android-app/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "apk=$APK" >> "$GITHUB_OUTPUT"

          ls -lh "$APK"

      # ---------------------------------------------------------
      # 14. Sign APK with temporary CI key
      # ---------------------------------------------------------
      - name: Sign APK
        shell: bash
        run: |
          APK="${{ steps.apk.outputs.apk }}"
          SIGNED="android-app/app/build/outputs/apk/debug/ycash-android-node-debug-signed.apk"

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          test -x "$APKSIGNER"
          test -f "$APK"

          "$APKSIGNER" sign \
            --ks "$CI_KEYSTORE" \
            --ks-key-alias "$CI_KEY_ALIAS" \
            --ks-pass "pass:$CI_KEYSTORE_PASSWORD" \
            --key-pass "pass:$CI_KEY_PASSWORD" \
            --out "$SIGNED" \
            "$APK"

          test -f "$SIGNED"

          echo "Signed APK:"
          ls -lh "$SIGNED"

      # ---------------------------------------------------------
      # 15. Verify APK signature
      # ---------------------------------------------------------
      - name: Verify APK signature
        shell: bash
        run: |
          SIGNED="android-app/app/build/outputs/apk/debug/ycash-android-node-debug-signed.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          "$APKSIGNER" verify \
            --verbose \
            "$SIGNED"

      # ---------------------------------------------------------
      # 16. Verify node is inside signed APK
      # ---------------------------------------------------------
      - name: Verify bundled Ycash node
        shell: bash
        run: |
          SIGNED="android-app/app/build/outputs/apk/debug/ycash-android-node-debug-signed.apk"

          unzip -l "$SIGNED" | grep \
            "assets/ycash-android-node"

          echo "Ycash ARM64 node confirmed inside APK."

      # ---------------------------------------------------------
      # 17. Verify APK package
      # ---------------------------------------------------------
      - name: Verify final APK
        shell: bash
        run: |
          SIGNED="android-app/app/build/outputs/apk/debug/ycash-android-node-debug-signed.apk"

          test -f "$SIGNED"

          echo "Final APK:"
          ls -lh "$SIGNED"

      # ---------------------------------------------------------
      # 18. Upload signed APK
      # ---------------------------------------------------------
      - name: Upload signed debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ycash-android-node-debug-signed
          path: android-app/app/build/outputs/apk/debug/ycash-android-node-debug-signed.apk
          if-no-files-found: error

      # ---------------------------------------------------------
      # 19. Upload raw ARM64 node
      # ---------------------------------------------------------
      - name: Upload ARM64 node binary
        uses: actions/upload-artifact@v4
        with:
          name: ycash-android-node-arm64
          path: target/${{ env.RUST_TARGET }}/release/ycash-android-node
          if-no-files-found: error

      # ---------------------------------------------------------
      # 20. Cleanup temporary signing key
      # ---------------------------------------------------------
      - name: Remove temporary signing keystore
        if: always()
        shell: bash
        run: |
          rm -f "$CI_KEYSTORE"
